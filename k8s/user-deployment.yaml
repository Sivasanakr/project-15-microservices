apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: microservices

spec:

  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:

    metadata:
      labels:
        app: user-service

    spec:

      containers:

        - name: user-service

          image: AKIAVTHCYSMUKISHZVQG.dkr.ecr.ap-south-1.amazonaws.com/user-service:1.0

          ports:
            - containerPort: 8081

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081

            initialDelaySeconds: 30
            periodSeconds: 20
