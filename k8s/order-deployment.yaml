apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: microservices

spec:

  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:

    metadata:
      labels:
        app: order-service

    spec:

      containers:

        - name: order-service

          image: YOUR_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/order-service:1.0

          ports:
            - containerPort: 8082

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082

            initialDelaySeconds: 30
            periodSeconds: 20
